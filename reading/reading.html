<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading Practice - Cambridge & Vol Actual Tests</title>
  
  <!-- Font Plus Jakarta Sans chuẩn Duolingo, hỗ trợ tiếng Việt 100% -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css-r/reading.css">

  <style>
    /* CSS RIÊNG CHO TRANG DANH MỤC READING CATALOG */
    .reading-hero {
      background: linear-gradient(135deg, #8B1518 0%, #B91C1C 100%);
      color: #FFFFFF;
      padding: 24px 28px;
      border-radius: 22px;
      margin-bottom: 24px;
      border: 2.5px solid #630D10;
      border-bottom: 5.5px solid #45080A;
      box-shadow: 0 6px 18px rgba(139, 21, 24, 0.2);
    }
    .reading-hero h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .reading-hero p {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      opacity: 0.95;
    }

    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .series-tabs-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
    }

    .tabs-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 18px;
      border-radius: 20px;
      border: 2.5px solid #E8E2D8;
      border-bottom: 5px solid #D3CBC0;
    }
    .tab-label {
      font-weight: 900;
      font-size: 14px;
      margin-right: 6px;
      min-width: 140px;
      letter-spacing: 0.3px;
    }

    .tab-btn {
      background: #FAF7F2;
      border: 2px solid #E8E2D8;
      border-bottom: 4px solid #D3CBC0;
      color: #261F1D;
      padding: 8px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.08s ease;
    }
    .tab-btn:hover { background: #FFFFFF; }
    .tab-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

    .tab-btn.active-cam {
      background: #8B1518 !important;
      border-color: #630D10 !important;
      border-bottom: 4px solid #45080A !important;
      color: #FFFFFF !important;
    }
    .tab-btn.active-vol {
      background: #4338CA !important;
      border-color: #312E81 !important;
      border-bottom: 4px solid #1E1B4B !important;
      color: #FFFFFF !important;
    }

    .test-heading {
      font-size: 18px;
      font-weight: 900;
      color: #261F1D;
      margin: 28px 0 14px 0;
      padding-bottom: 8px;
      border-bottom: 3px solid #8B1518;
    }
    .test-heading.vol-heading {
      border-bottom-color: #4338CA;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .test-card {
      background: #FFFFFF;
      border: 2.5px solid #E8E2D8;
      border-bottom: 5.5px solid #D3CBC0;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      transition: transform 0.1s ease;
    }
    .test-card:hover { transform: translateY(-2px); }

    .test-card.is-completed {
      border-color: #86EFAC !important;
      border-bottom-color: #22C55E !important;
      background: #F0FDF4 !important;
    }

    .badge-reading {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 900;
      background: #FDEDEE;
      color: #8B1518;
      border: 1.5px solid #F8B4B7;
      margin-bottom: 8px;
    }
    .badge-reading.badge-vol {
      background: #EEF2FF;
      color: #4338CA;
      border-color: #C7D2FE;
    }
    .badge-done {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      background: #DCFCE7;
      color: #15803D;
      border: 1.5px solid #86EFAC;
    }

    .card-title {
      color: #8B1518;
      font-size: 16px;
      font-weight: 900;
      margin: 0 0 6px 0;
      line-height: 1.4;
    }
    .card-title.vol-title { color: #4338CA; }
    .card-desc {
      font-size: 13.5px;
      font-weight: 700;
      color: #756D68;
      margin: 0 0 16px 0;
      line-height: 1.45;
    }

    .btn-play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #8B1518;
      color: #FFFFFF !important;
      border: none;
      border-bottom: 4.5px solid #5E0C0E;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: all 0.08s ease;
    }
    .btn-play:hover { background: #A01B20; }
    .btn-play:active { transform: translateY(2px); border-bottom-width: 2px; }

    .btn-play.btn-vol {
      background: #4338CA;
      border-bottom-color: #312E81;
    }
    .btn-play.btn-vol:hover { background: #3730A3; }

    .btn-play.btn-done {
      background: #22C55E !important;
      border-bottom-color: #15803D !important;
    }
    .btn-play.btn-done:hover { background: #16A34A !important; }
  </style>
</head>
<body>

<div class="container-rd">
  <div class="reading-hero">
    <h1>PHÒNG LUYỆN THI IELTS READING</h1>
    <p>Trọn bộ Cambridge 17-21, Đề Vol 1-8, Kho Bài Sưu Tầm (101–320) & Luyện Theo Kỹ Năng P1/P2/P3 • Chấm điểm & phân tích tức thì</p>
  </div>

  <div class="top-nav-bar">
    <a href="../index.html" class="btn-3d btn-3d-white" style="padding: 10px 18px; font-size: 14px;">
      ← Về Cổng Thi Chính
    </a>
    <span id="userStatusTag" style="font-size: 13.5px; color: var(--text-muted); font-weight: 800;"></span>
  </div>

  <div class="series-tabs-container" id="seriesTabsContainer"></div>

  <div id="readingCatalogContainer"></div>
</div>

<script type="module">
  import { stateManager } from '../js/state.js';
  import { initReadingCatalogEvents, renderReadingCatalog } from './js-r/catalog-renderer.js';
  import { initSubsystemAdminEditor } from './js-r/subsystem-admin-editor.js';

  try {
    const user = stateManager.getUser();
    const tagEl = document.getElementById('userStatusTag');
    if (tagEl && user && user.email) {
      tagEl.innerText = `Học viên: ${user.name || user.email}`;
    }
  } catch (e) {}

  async function bootReadingCatalog() {
    try {
      initReadingCatalogEvents();
      await renderReadingCatalog();
      initSubsystemAdminEditor();
    } catch (err) {
      console.error('Lỗi khởi động danh mục Reading:', err);
      const box = document.getElementById('readingCatalogContainer');
      if (box) {
        box.innerHTML = '<div class="tabs-bar" style="color:#DC2626;">⚠️ Không thể tải danh mục bài đọc. Vui lòng tải lại trang (F5).</div>';
      }
    }
  }

  bootReadingCatalog();
</script>
</body>
</html>
